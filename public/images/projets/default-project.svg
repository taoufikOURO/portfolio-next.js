<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Arrière-plan -->
  <rect width="400" height="300" fill="#f8f9fa"/>
  
  <!-- Grille subtile -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e9ecef" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grid)"/>
  
  <!-- Container principal -->
  <rect x="50" y="50" width="300" height="200" rx="8" fill="white" stroke="#14213d" stroke-width="2" stroke-opacity="0.1"/>
  
  <!-- Icône code -->
  <g transform="translate(180, 120)">
    <rect x="-20" y="-20" width="40" height="40" rx="6" fill="#14213d" fill-opacity="0.05"/>
    <path d="M-10 -5 L-15 0 L-10 5 M10 -5 L15 0 L10 5 M-5 -10 L5 10" stroke="#14213d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-opacity="0.4"/>
  </g>
  
  <!-- Lignes décoratives -->
  <rect x="80" y="180" width="60" height="4" rx="2" fill="#fca311" fill-opacity="0.6"/>
  <rect x="80" y="190" width="40" height="3" rx="1.5" fill="#14213d" fill-opacity="0.2"/>
  <rect x="80" y="198" width="50" height="3" rx="1.5" fill="#14213d" fill-opacity="0.15"/>
  
  <!-- Accent décoratif -->
  <rect x="0" y="296" width="400" height="4" fill="#fca311" fill-opacity="0.8"/>
</svg>